<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Fluently — Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap');
:root{
  --ink:#0a0a0a; --paper:#faf9f6; --paper-dim:#f1efe9;
  --line:#d9d6cd; --grey:#726f68; --grey-soft:#a7a49c;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;}
.mark{font-family:var(--serif);font-size:20px;display:inline-flex;align-items:center;gap:8px;letter-spacing:.01em;}
.mark .dot{width:6px;height:6px;background:var(--ink);display:inline-block;transform:rotate(45deg);flex-shrink:0;}
.mark em{font-style:italic;font-weight:400;}
.shell{max-width:480px;margin:0 auto;padding:60px 24px 100px;}
.header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:36px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;color:var(--grey);margin-bottom:7px;}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:12px 14px;font-family:var(--sans);font-size:15px;color:var(--ink);}
.field textarea{resize:vertical;min-height:80px;}
.field input:focus,.field textarea:focus{outline:2px solid var(--ink);outline-offset:1px;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:8px;padding:13px 22px;font-size:14px;font-family:var(--sans);cursor:pointer;width:100%;justify-content:center;}
.btn.ghost{background:transparent;color:var(--ink);margin-top:10px;}
.notice{border:1px solid var(--line);border-radius:8px;background:var(--paper-dim);padding:14px 16px;font-size:13.5px;color:var(--grey);margin-bottom:26px;}
.error{color:var(--ink);font-size:13px;display:none;margin-bottom:14px;}
.section-title{font-size:13px;color:var(--grey-soft);margin:38px 0 14px;padding-top:26px;border-top:1px solid var(--line);}
.code-box{width:100%;font-family:monospace;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--paper-dim);min-height:160px;}
.copied{font-size:13px;color:var(--grey);margin-top:8px;display:none;}
</style>
</head>
<body>
<div class="shell" id="app"></div>

<script>
const ADMIN_EMAIL = 'mada@gmail.com';
const ADMIN_PASSWORD = 'mad411';
const SESSION_KEY = 'fluently_admin_session';
const STAGE_KEY = 'fluently_staged_products';

const app = document.getElementById('app');

function getStaged(){ try{ return JSON.parse(localStorage.getItem(STAGE_KEY)) || []; }catch(e){ return []; } }
function saveStaged(list){ localStorage.setItem(STAGE_KEY, JSON.stringify(list)); }

function renderLogin(){
  app.innerHTML = `
    <div class="header"><span class="mark"><span class="dot"></span>fluent<em>ly</em> · admin</span></div>
    <div class="field"><label>Email</label><input type="email" id="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="password" autocomplete="current-password"></div>
    <p class="error" id="error">Incorrect email or password.</p>
    <button class="btn" id="loginBtn">Sign in</button>
  `;
  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value;
    if(email === ADMIN_EMAIL && pass === ADMIN_PASSWORD){
      sessionStorage.setItem(SESSION_KEY, '1');
      renderDashboard();
    }else{
      document.getElementById('error').style.display = 'block';
    }
  });
}

function toCodeBlock(list){
  const items = list.map(p => `  {
    serialNumber: "${p.serialNumber}",
    name: "${p.name}",
    brand: "${p.brand}",
    material: "${p.material}",
    authenticity: "${p.authenticity}",
    origin: "${p.origin || ''}",
    description: "${p.description.replace(/"/g,'\\"')}",
    image: "${p.image}",
    dateAdded: "${p.dateAdded}",
    shopUrl: "${p.shopUrl || ''}"
  }`).join(',\n');
  return `const PRODUCTS = [\n${items}\n];`;
}

function renderDashboard(){
  const staged = getStaged();
  app.innerHTML = `
    <div class="header">
      <span class="mark"><span class="dot"></span>fluent<em>ly</em> · admin</span>
      <button class="btn ghost" id="logoutBtn" style="width:auto;padding:8px 14px;">Sign out</button>
    </div>

    <div class="notice">
      Add a product below, then copy the code that appears and paste it
      in place of <strong>const PRODUCTS = [...]</strong> in
      <strong>product.html</strong> — edit it directly on GitHub from
      your phone (open the file → pencil icon → paste → Commit changes).
    </div>

    <div class="field"><label>Product name</label><input id="f_name" placeholder="Ansel Bangle"></div>
    <div class="field"><label>Brand</label><input id="f_brand" placeholder="Studio Ansel"></div>
    <div class="field"><label>Serial number</label><input id="f_serial" placeholder="FL-240501-A2"></div>
    <div class="field"><label>Material</label><input id="f_material" placeholder="925 Sterling Silver"></div>
    <div class="field"><label>Authenticity status</label><input id="f_auth" value="Verified authentic"></div>
    <div class="field"><label>Country of origin</label><input id="f_origin" placeholder="United States"></div>
    <div class="field"><label>Photo URL (optional)</label><input id="f_image" placeholder="https://..."></div>
    <div class="field"><label>Shop link (optional)</label><input id="f_shop" placeholder="https://www.etsy.com/listing/..."></div>
    <div class="field"><label>Description</label><textarea id="f_desc" placeholder="Tell the story behind this product."></textarea></div>

    <button class="btn" id="addBtn">Add product</button>

    <div class="section-title">Code for product.html (${staged.length} product${staged.length === 1 ? '' : 's'})</div>
    <textarea class="code-box" id="codeBox" readonly>${toCodeBlock(staged)}</textarea>
    <button class="btn ghost" id="copyBtn">Copy code</button>
    <p class="copied" id="copiedMsg">Copied.</p>
  `;

  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem(SESSION_KEY);
    renderLogin();
  });

  document.getElementById('addBtn').addEventListener('click', () => {
    const name = document.getElementById('f_name').value.trim();
    const serial = document.getElementById('f_serial').value.trim();
    if(!name || !serial) return;
    const list = getStaged();
    list.push({
      name,
      brand: document.getElementById('f_brand').value.trim(),
      serialNumber: serial,
      material: document.getElementById('f_material').value.trim(),
      authenticity: document.getElementById('f_auth').value.trim() || 'Verified authentic',
      origin: document.getElementById('f_origin').value.trim(),
      image: document.getElementById('f_image').value.trim(),
      shopUrl: document.getElementById('f_shop').value.trim(),
      description: document.getElementById('f_desc').value.trim(),
      dateAdded: new Date().toISOString().slice(0,10)
    });
    saveStaged(list);
    renderDashboard();
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const box = document.getElementById('codeBox');
    box.select();
    box.setSelectionRange(0, 999999);
    try{
      document.execCommand('copy');
      document.getElementById('copiedMsg').style.display = 'block';
    }catch(e){
      alert('Press and hold the code box above to copy it manually.');
    }
  });
}

sessionStorage.getItem(SESSION_KEY) === '1' ? renderDashboard() : renderLogin();
</script>

</body>
</html>
