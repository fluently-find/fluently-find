<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluently — Product details</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap');
:root{
  --ink:#0a0a0a; --paper:#faf9f6; --paper-dim:#f1efe9;
  --line:#d9d6cd; --grey:#726f68; --grey-soft:#a7a49c;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
h1{font-family:var(--serif);font-weight:400;line-height:1.1;margin:0 0 6px;letter-spacing:-0.01em;}
a{color:inherit;text-decoration:none;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:26px 24px;border-bottom:1px solid var(--line);}
.nav .mark{font-family:var(--serif);font-size:20px;display:inline-flex;align-items:center;gap:8px;letter-spacing:.01em;}
.nav .mark .dot{width:7px;height:7px;background:var(--ink);display:inline-block;transform:rotate(45deg);flex-shrink:0;}
.nav .mark em{font-style:italic;font-weight:400;}
.nav .links{display:flex;gap:22px;}
.nav .links a{font-size:12.5px;color:var(--grey);letter-spacing:.02em;position:relative;padding-bottom:3px;}
.nav .links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--ink);transition:width .3s ease;}
.nav .links a:hover::after{width:100%;}
.nav .links a:hover{color:var(--ink);}
.shell{max-width:520px;margin:0 auto;padding:0 24px 80px;}
.hero-media{position:relative;width:100vw;margin-left:calc(50% - 50vw);aspect-ratio:4/5;background:var(--paper-dim);overflow:hidden;}
.hero-media video,.hero-media img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-media.has-video{cursor:pointer;}
.hero-media::after{content:'';position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(to bottom, rgba(250,249,246,0) 0%, var(--paper) 90%);pointer-events:none;}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--ink);padding:6px 12px;border-radius:999px;margin-bottom:22px;}
.brand{color:var(--grey);font-size:15px;display:block;margin-bottom:22px;}
.desc{font-size:15px;color:var(--grey);line-height:1.7;margin-bottom:28px;}
.spec-list{border-top:1px solid var(--line);}
.spec-row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;}
.spec-row .label{color:var(--grey-soft);}
.spec-row .value.mono{font-family:monospace;letter-spacing:.03em;}
.barcode{margin-top:30px;}
.barcode svg{width:100%;height:50px;display:block;}
.barcode-caption{font-size:12px;color:var(--grey-soft);margin-top:8px;letter-spacing:.04em;}
.shop-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);text-align:center;padding:14px 20px;font-size:14px;margin-top:16px;border:1px solid var(--ink);border-radius:8px;transition:background .2s ease,color .2s ease;}
.shop-btn:hover{background:var(--paper);color:var(--ink);}
.market-row{display:flex;gap:10px;margin-top:36px;justify-content:flex-end;}
.market-row a{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;transition:border-color .2s ease;}
.market-row a:hover{border-color:var(--ink);}
.market-row svg{width:15px;height:15px;}
.not-found{padding:60px 0;}
.not-found p{color:var(--grey);}
.enter{opacity:0;transform:translateY(14px);animation:enter .8s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes enter{to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="mark"><span class="dot"></span>fluent<em>ly</em></a>
  <div class="links">
    <a href="index.html">Collection</a>
    <a href="#">Verify</a>
  </div>
</nav>

<main class="shell" id="content"></main>

<script>
/* ===========================================================
   Daftar produk ada di sini. Untuk menambah produk baru:
   1. Buka admin.html, isi form, salin kode array yang muncul.
   2. Edit file ini di GitHub (tombol pensil di halaman file),
      tempel kode itu menggantikan array PRODUCTS di bawah.
   3. Commit changes.
   =========================================================== */
const PRODUCTS = [
  {
    serialNumber: "CH-925-2006",
    name: "CH Luxury Cross BRACELET",
    brand: "Chrome Hearts",
    material: "Pre-Silver",
    authenticity: "Verified authentic",
    origin: "United States",
    description: "Luxury Cross Flower Bracelet – Premium Silver Chain Bracelet, Gothic Floral Cross Link Design, Unisex Statement Jewelry",
    image: "ch-bracelet.jpg",
    video: "ch-bracelet.mp4",
    dateAdded: "2026-03-19",
    shopUrl: "https://www.etsy.com/listing/4452509337/luxury-cross-flower-bracelet-premium"
  }
];

function renderBarcode(serial){
  const chars = serial.split('');
  let x = 0;
  const bars = chars.map((c,i)=>{
    const code = c.charCodeAt(0);
    const width = 2 + (code % 4);
    const bar = `<rect x="${x}" y="0" width="${width}" height="50" fill="#0a0a0a"></rect>`;
    x += width + 3 + (i % 3);
    return bar;
  }).join('');
  return `<svg viewBox="0 0 ${x} 50" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">${bars}</svg>`;
}

const params = new URLSearchParams(window.location.search);
const serial = params.get('sn');
const product = PRODUCTS.find(p => p.serialNumber.toLowerCase() === (serial||'').toLowerCase());
const content = document.getElementById('content');

if(!product){
  content.innerHTML = `
    <div class="not-found">
      <h1>Item not found</h1>
      <p>No product matches this code. Please make sure it was scanned correctly.</p>
    </div>`;
}else{
  content.innerHTML = `
    <div class="hero-media${product.video ? ' has-video' : ''}">
      ${product.video
        ? `<video id="productVideo" src="${product.video}" poster="${product.image}" autoplay muted loop playsinline></video>`
        : product.image
        ? `<img src="${product.image}" alt="${product.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{innerHTML:'<svg viewBox=&quot;0 0 200 200&quot; width=&quot;45%&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;><circle cx=&quot;100&quot; cy=&quot;100&quot; r=&quot;70&quot; fill=&quot;none&quot; stroke=&quot;#a7a49c&quot; stroke-width=&quot;1&quot;/><circle cx=&quot;100&quot; cy=&quot;100&quot; r=&quot;52&quot; fill=&quot;none&quot; stroke=&quot;#a7a49c&quot; stroke-width=&quot;1&quot;/></svg>'}).firstElementChild)">`
        : `<svg viewBox="0 0 200 200" width="45%" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
             <circle cx="100" cy="100" r="70" fill="none" stroke="#a7a49c" stroke-width="1"/>
             <circle cx="100" cy="100" r="52" fill="none" stroke="#a7a49c" stroke-width="1"/>
           </svg>`}
    </div>
    <div class="enter" style="animation-delay:.1s">
      <span class="badge">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.5 12L13 4.5" stroke="#0a0a0a" stroke-width="1.4"/></svg>
        ${product.authenticity}
      </span>
      <h1>${product.name}</h1>
      <span class="brand">
        ${product.brand}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-2px;margin-left:4px;" aria-label="Verified brand">
          <path d="M12 2L14.5 4.5L18 3.8L18.5 7.3L21.8 8.8L20 12L21.8 15.2L18.5 16.7L18 20.2L14.5 19.5L12 22L9.5 19.5L6 20.2L5.5 16.7L2.2 15.2L4 12L2.2 8.8L5.5 7.3L6 3.8L9.5 4.5L12 2Z" fill="#0a0a0a"/>
          <path d="M8.5 12.2L10.8 14.5L15.5 9.5" stroke="#faf9f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <div class="desc">${product.description}</div>
      <div class="spec-list">
        <div class="spec-row"><span class="label">Serial number</span><span class="value mono">${product.serialNumber}</span></div>
        <div class="spec-row"><span class="label">Material</span><span class="value">${product.material}</span></div>
        <div class="spec-row"><span class="label">Country of origin</span><span class="value">${product.origin || '—'}</span></div>
        <div class="spec-row"><span class="label">Registered</span><span class="value">${product.dateAdded}</span></div>
      </div>
      <div class="barcode">
        ${renderBarcode(product.serialNumber)}
        <div class="barcode-caption">${product.serialNumber}</div>
      </div>
      <div class="market-row">
        <a href="https://www.amazon.com/s?k=${encodeURIComponent(product.name)}" target="_blank" rel="noopener" aria-label="Search on Amazon" title="Search on Amazon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 16c4 3 12 3 16 0" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round"/><path d="M17 15.5c1.5-.3 2.5-1 2.5-1s-.3 1.5-1 2.3" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round"/></svg>
        </a>
        <a href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(product.name)}" target="_blank" rel="noopener" aria-label="Search on eBay" title="Search on eBay">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="12" r="4" stroke="#0a0a0a" stroke-width="1.2"/><circle cx="17" cy="12" r="4" stroke="#0a0a0a" stroke-width="1.2"/></svg>
        </a>
        <a href="https://www.google.com/search?tbm=shop&q=${encodeURIComponent(product.name)}" target="_blank" rel="noopener" aria-label="Search on Google Shopping" title="Search on Google Shopping">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" stroke="#0a0a0a" stroke-width="1.2"/><path d="M4 12h16M12 4c2.5 2.2 2.5 13.8 0 16M12 4c-2.5 2.2-2.5 13.8 0 16" stroke="#0a0a0a" stroke-width="1"/></svg>
        </a>
      </div>
      ${product.shopUrl ? `<a class="shop-btn" href="${product.shopUrl}" target="_blank" rel="noopener">View product</a>` : ''}
    </div>`;

  if(product.video){
    const vid = document.getElementById('productVideo');
    vid.addEventListener('click', () => {
      if(vid.paused){ vid.play(); } else { vid.pause(); }
    });
  }
}
</script>

</body>
</html>
